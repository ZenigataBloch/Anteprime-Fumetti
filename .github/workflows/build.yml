name: Build e Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Push normale su main: solo verifica che compili (nessun file da scaricare)
      - name: Verifica compilazione
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: gradle :app:assembleDebug

      # Tag vX.Y: APK firmato + Release
      - name: APK firmato
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          export VERSION_NAME="${GITHUB_REF_NAME#v}"
          export VERSION_CODE="${{ github.run_number }}"
          gradle :app:assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "Anteprime-${GITHUB_REF_NAME}.apk"

      - name: Pubblica Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Anteprime-*.apk
          generate_release_notes: true
